name: 🐯 dori bot 실시간 이슈 브리핑 (30분 주기)

on:
  schedule:
    # 30분마다 자동 실행
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  doribogo-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 2. 파이썬 3.11 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 3. 패키지 설치
        run: |
          pip install requests python-dotenv

      - name: 🛰️ 4. 실시간 5대 레이더 가동 & 디스코드 브리핑 발송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_ }}
        run: |
          python -c "
          import os
          import sys
          from datetime import datetime
          sys.path.append('.')
          import doribogo_bot

          doribogo_bot.DISCORD_WEBHOOK_URL = os.environ.get('DISCORD_WEBHOOK_URL', '')
          doribogo_bot.TELEGRAM_BOT_TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          doribogo_bot.TELEGRAM_CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '')
          doribogo_bot.GEMINI_API_KEY = os.environ.get('GEMINI_API_KEY', '')

          today_str = datetime.now().strftime('%m월 %d일')
          keywords = ['백컨트리 360', '캠핑 텐트 특가']
          for kw in keywords:
              print(f'[*] 오늘 실시간 이슈 브리핑 가동: {kw}')
              card = doribogo_bot.run_full_doribogo(kw)
              doribogo_bot.send_broadcast(f'⚡ [{today_str} 실시간 이슈] {kw}', card)
          print('[*] 모든 실시간 브리핑 발송 완료!')
          "
